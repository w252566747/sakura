name: build sakura Win32 Release EXE only

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'sakura_core/**'
      - 'src/**'
      - 'sakura.sln'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'tools/vcpkg/**'
      - '.github/workflows/build-win32-release.yml'

concurrency:
  group: win32-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: pwsh

env:
  CI_ACCOUNT_NAME: ${{ github.actor }}
  CI_REPO_NAME: ${{ github.repository }}
  CI_BUILD_VERSION: ${{ github.run_id }}
  CI_BUILD_NUMBER: ${{ github.run_number }}
  CI_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  GITHUB_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,read"
  VCPKG_NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_NUGET_OWNER: ${{ github.repository_owner }}
  VCPKG_ROOT: ${{ github.workspace }}\tools\vcpkg

jobs:
  build-win32-release:
    name: Build Win32 Release EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.14.3' }}
          architecture: x86

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          activate-environment: true

      - name: Install build requirements
        run: uv pip install --require-hashes --no-build --no-deps -r requirements.txt

      - name: Bootstrap vcpkg
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          if (-not (Test-Path ".\bootstrap-vcpkg.bat" -PathType Leaf)) {
              throw ".\bootstrap-vcpkg.bat not found."
          }

          & .\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to bootstrap vcpkg (exit code: $LASTEXITCODE)."
          }

      - name: Configure GitHub Packages for vcpkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
          $nuget = & $vcpkg fetch nuget
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $nuget -PathType Leaf)) {
              throw "Failed to obtain nuget.exe."
          }

          & $nuget sources remove -Name GitHubPackages -NonInteractive 2>$null
          & $nuget sources add `
              -Name GitHubPackages `
              -Source "$env:VCPKG_NUGET_FEED" `
              -UserName "$env:VCPKG_NUGET_OWNER" `
              -Password "$env:GITHUB_TOKEN" `
              -StorePasswordInClearText `
              -NonInteractive
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to add the GitHub Packages NuGet source."
          }

      - name: Restore x86 vcpkg dependencies
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x86-windows-static --clean-after-build'

      - name: Build Sakura Editor Win32 Release
        run: build-sln.bat Win32 Release
        shell: cmd

      - name: Set up Python for GUI tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.3'
          architecture: x64

      - name: Install Windows GUI test tools
        run: python -m pip install --disable-pip-version-check pywinauto==0.6.9 Pillow==13.0.0

      - name: Launch and exercise the Win32 editor
        run: python tools/windows-ui/smoke_test.py --exe Win32/Release/sakura.exe --output test-output/windows-gui

      - name: Upload Windows GUI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SakuraEditor-Win32-GUI-Evidence
          path: test-output/windows-gui/
          if-no-files-found: warn

      - name: Upload sakura.exe
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SakuraEditor-Win32-Release-EXE
          path: Win32/Release/sakura.exe
          if-no-files-found: error
